</style></head><body><main class="wrap"><a class="back" href="/">← Zurück zu GameTik</a><section class="panel"><h1>💳 PayPal & Geschenke</h1><p class="muted">Unterstütze GameTik oder sende ein virtuelles Geschenk. Die Zahlung wird serverseitig über PayPal bestätigt.</p><button data-gift="Spende">♥ 5 € mit PayPal spenden</button><p class="muted">Virtuelle Geschenke</p><button class="gift" data-gift="Herz"><img class="gt-real-gift-icon" src="/assets/gift-heart.svg" alt="" aria-hidden="true"><span>Herz · 0,99 €</span></button><button class="gift" data-gift="Stern"><img class="gt-real-gift-icon" src="/assets/gift-star.svg" alt="" aria-hidden="true"><span>Stern · 1,99 €</span></button><button class="gift" data-gift="Feuer"><img class="gt-real-gift-icon" src="/assets/gift-fire.svg" alt="" aria-hidden="true"><span>Feuer · 2,99 €</span></button><button class="gift" data-gift="Krone"><img class="gt-real-gift-icon" src="/assets/gift-crown.svg" alt="" aria-hidden="true"><span>Krone · 4,99 €</span></button><div id="status" class="muted" aria-live="polite"></div></section><section class="panel"><h2>Admin</h2><p class="muted">Betreiberzugang zur Verwaltung.</p><a class="btn" href="/admin.html">🛡 Admin Login öffnen</a></section></main><script>(()=>{const host=location.hostname,onRender=host.endsWith('.onrender.com'),local=['localhost','127.0.0.1'].includes(host);const API_BASE=window.GAMETIK_API_BASE||((onRender||local)?'':'https://chatweb-iajl.onrender.com');const status=document.getElementById('status');async function buy(gift){const token=localStorage.getItem('gametik_token')||'';if(!token){status.textContent='Bitte zuerst auf GameTik einen Nickname wählen/anmelden und danach erneut versuchen.';return;}status.textContent='PayPal-Bestellung wird erstellt …';const r=await fetch(API_BASE+'/api/payments/paypal/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({gift})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'PayPal-Bestellung konnte nicht erstellt werden.');if(!d.approvalUrl||!/^https:\/\/(www\.)?paypal\.com\//i.test(d.approvalUrl)&&!/^https:\/\/(www\.)?sandbox\.paypal\.com\//i.test(d.approvalUrl))throw Error('PayPal hat keinen gültigen Zahlungslink geliefert.');location.href=d.approvalUrl;}document.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await buy(b.dataset.gift)}catch(e){status.textContent=e.message}finally{b.disabled=false}}));const p=new URLSearchParams(location.search);if(p.get('paypal')==='success')status.textContent='Zahlung zurückgekehrt. Öffne GameTik wieder, damit die bestehende Bestätigung verarbeitet werden kann.';})();</script></body></html>
