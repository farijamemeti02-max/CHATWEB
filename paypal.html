<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b16"><title>GameTik – PayPal & Geschenke</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1d2442,#070810 65%);color:#f5f7ff;font:16px/1.5 system-ui,sans-serif;padding:20px}.wrap{max-width:680px;margin:30px auto}.panel{background:#111526;border:1px solid #303b5a;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 15px 45px #0005}h1{margin:0 0 8px}.muted{color:#aab4d0}button,a.btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:13px;border:1px solid #364b6b;background:linear-gradient(110deg,#26e6ff,#ff31c8);color:#080a14;font-weight:800;text-decoration:none;text-align:center;font-size:15px}button.gift{background:#171d31;color:#fff;border:1px solid #394663}#status{overflow-wrap:anywhere;min-height:24px}.back{display:inline-block;color:#26e6ff;margin-bottom:18px}</style><style id="gametik-logo-button-theme-v2">
/* GameTik Logo Theme: neon pink + cyan/blue + violet + silver, applied consistently site-wide */
:root{--gt-violet:#9b5cff;--gt-silver:#e6edf7;--gt-blue:#3b82f6;--gt-cyan:#24dfff;--gt-pink:#ff28d2;--gt-button-gradient:linear-gradient(112deg,#ff28d2 0%,#9b5cff 48%,#24dfff 100%);--gt-button-text:#fff}
button,.button,.btn,[role="button"],input[type="button"],input[type="submit"],input[type="reset"]{
  border:1px solid #c7d8ff66!important;
  background:var(--gt-button-gradient)!important;
  color:var(--gt-button-text)!important;
  font-weight:800;
  box-shadow:0 0 0 1px #24dfff14,0 4px 14px #0005,0 0 13px #9b5cff24;
  transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
}
button:hover,.button:hover,.btn:hover,[role="button"]:hover,input[type="button"]:hover,input[type="submit"]:hover,input[type="reset"]:hover{
  filter:brightness(1.13) saturate(1.12)!important;
  box-shadow:0 0 0 1px #e6edf788,0 0 12px #ff28d255,0 0 22px #24dfff38!important;
  transform:translateY(-1px);
}
button:active,.button:active,.btn:active,[role="button"]:active,input[type="button"]:active,input[type="submit"]:active,input[type="reset"]:active{transform:translateY(0) scale(.985)}
button:focus-visible,.button:focus-visible,.btn:focus-visible,[role="button"]:focus-visible,input[type="button"]:focus-visible,input[type="submit"]:focus-visible,input[type="reset"]:focus-visible{outline:2px solid var(--gt-silver)!important;outline-offset:3px}
/* Secondary actions use the same logo palette, with a darker glass surface */
button.secondary,.secondary button,button.close,.close,.navbtn:not(.active),.story-item,.profile-tab:not(.active){background:linear-gradient(135deg,#17152a,#101a2c)!important;color:#eaf2ff!important;border:1px solid #8b5cf688!important;box-shadow:inset 0 0 0 1px #24dfff12,0 0 10px #9b5cff12}
button.secondary:hover,.close:hover,.navbtn:not(.active):hover,.story-item:hover,.profile-tab:not(.active):hover{background:linear-gradient(110deg,#4a174f,#142d4d)!important;border-color:#24dfff!important}
button.danger,.danger,button[aria-label*="Löschen"],button[aria-label*="Entfernen"]{background:linear-gradient(110deg,#ff4d8d,#9b5cff)!important;color:#fff!important;border-color:#ff9dc8!important}
.navbtn.active,.create-neon,.paypal-nav,.admin-nav,.story-launch,.camera-action,.gift,.camera-shutter{border-color:#24dfff!important;box-shadow:0 0 12px #24dfff26,0 0 16px #ff28d222}
.navbtn.active{background:linear-gradient(110deg,#ff28d238,#9b5cff30,#24dfff24)!important;color:#fff!important}
input:focus,textarea:focus,select:focus{outline:1px solid #24dfff!important;border-color:#ff28d2!important;box-shadow:0 0 0 3px #9b5cff30!important}
a{color:#24dfff}
@media(prefers-reduced-motion:reduce){button,.button,.btn,[role="button"]{transition:none!important}}
</style>
</head><body><main class="wrap"><a class="back" href="/">← Zurück zu GameTik</a><section class="panel"><h1>💳 PayPal & Geschenke</h1><p class="muted">Unterstütze GameTik oder sende ein virtuelles Geschenk. Die Zahlung wird serverseitig über PayPal bestätigt.</p><button data-gift="Spende">♥ 5 € mit PayPal spenden</button><p class="muted">Virtuelle Geschenke</p><button class="gift" data-gift="Herz">❤️ Herz · 0,99 €</button><button class="gift" data-gift="Stern">⭐ Stern · 1,99 €</button><button class="gift" data-gift="Feuer">🔥 Feuer · 2,99 €</button><button class="gift" data-gift="Krone">👑 Krone · 4,99 €</button><div id="status" class="muted" aria-live="polite"></div></section><section class="panel"><h2>Admin</h2><p class="muted">Betreiberzugang zur Verwaltung.</p><a class="btn" href="/admin.html">🛡 Admin Login öffnen</a></section></main><script>(()=>{const host=location.hostname,onRender=host.endsWith('.onrender.com'),local=['localhost','127.0.0.1'].includes(host);const API_BASE=window.GAMETIK_API_BASE||((onRender||local)?'':'https://chatweb-iajl.onrender.com');const status=document.getElementById('status');async function buy(gift){const token=localStorage.getItem('gametik_token')||'';if(!token){status.textContent='Bitte zuerst auf GameTik einen Nickname wählen/anmelden und danach erneut versuchen.';return;}status.textContent='PayPal-Bestellung wird erstellt …';const r=await fetch(API_BASE+'/api/payments/paypal/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({gift})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'PayPal-Bestellung konnte nicht erstellt werden.');if(!d.approvalUrl||!/^https:\/\/(www\.)?paypal\.com\//i.test(d.approvalUrl)&&!/^https:\/\/(www\.)?sandbox\.paypal\.com\//i.test(d.approvalUrl))throw Error('PayPal hat keinen gültigen Zahlungslink geliefert.');location.href=d.approvalUrl;}document.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await buy(b.dataset.gift)}catch(e){status.textContent=e.message}finally{b.disabled=false}}));const p=new URLSearchParams(location.search);if(p.get('paypal')==='success')status.textContent='Zahlung zurückgekehrt. Öffne GameTik wieder, damit die bestehende Bestätigung verarbeitet werden kann.';})();</script></body></html>
