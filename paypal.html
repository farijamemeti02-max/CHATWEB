<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b16"><title>GameTik – PayPal & Geschenke</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1d2442,#070810 65%);color:#f5f7ff;font:16px/1.5 system-ui,sans-serif;padding:20px}.wrap{max-width:680px;margin:30px auto}.panel{background:#111526;border:1px solid #303b5a;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 15px 45px #0005}h1{margin:0 0 8px}.muted{color:#aab4d0}button,a.btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:13px;border:1px solid #364b6b;background:linear-gradient(110deg,#26e6ff,#ff31c8);color:#080a14;font-weight:800;text-decoration:none;text-align:center;font-size:15px}button.gift{background:#171d31;color:#fff;border:1px solid #394663}#status{overflow-wrap:anywhere;min-height:24px}.back{display:inline-block;color:#26e6ff;margin-bottom:18px}</style></head><body><main class="wrap"><a class="back" href="/">← Zurück zu GameTik</a><section class="panel"><h1>💳 PayPal & Geschenke</h1><p class="muted">Unterstütze GameTik oder sende ein virtuelles Geschenk. Die Zahlung wird serverseitig über PayPal bestätigt.</p><button data-gift="Spende">♥ 5 € mit PayPal spenden</button><p class="muted">Virtuelle Geschenke</p><button class="gift" data-gift="Herz">❤️ Herz · 0,99 €</button><button class="gift" data-gift="Stern">⭐ Stern · 1,99 €</button><button class="gift" data-gift="Feuer">🔥 Feuer · 2,99 €</button><button class="gift" data-gift="Krone">👑 Krone · 4,99 €</button><div id="status" class="muted" aria-live="polite"></div></section><section class="panel"><h2>Admin</h2><p class="muted">Betreiberzugang zur Verwaltung.</p><a class="btn" href="/admin.html">🛡 Admin Login öffnen</a></section></main><script>(()=>{const host=location.hostname,onRender=host.endsWith('.onrender.com'),local=['localhost','127.0.0.1'].includes(host);const API_BASE=window.GAMETIK_API_BASE||((onRender||local)?'':'https://chatweb-iajl.onrender.com');const status=document.getElementById('status');async function buy(gift){const token=localStorage.getItem('gametik_token')||'';if(!token){status.textContent='Bitte zuerst auf GameTik einen Nickname wählen/anmelden und danach erneut versuchen.';return;}status.textContent='PayPal-Bestellung wird erstellt …';const r=await fetch(API_BASE+'/api/payments/paypal/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({gift})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'PayPal-Bestellung konnte nicht erstellt werden.');if(!d.approvalUrl||!/^https:\/\/(www\.)?paypal\.com\//i.test(d.approvalUrl)&&!/^https:\/\/(www\.)?sandbox\.paypal\.com\//i.test(d.approvalUrl))throw Error('PayPal hat keinen gültigen Zahlungslink geliefert.');location.href=d.approvalUrl;}document.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await buy(b.dataset.gift)}catch(e){status.textContent=e.message}finally{b.disabled=false}}));const p=new URLSearchParams(location.search);if(p.get('paypal')==='success')status.textContent='Zahlung zurückgekehrt. Öffne GameTik wieder, damit die bestehende Bestätigung verarbeitet werden kann.';})();</script></body></html>
